<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault HLS Pro</title>
    
    <!-- Core External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --bg-main: #0a0c10;
            --bg-card: #13171f;
            --bg-hover: #1c222d;
            --accent: #ff8c00;
            --accent-hover: #ffa033;
            --text-main: #f0f3f6;
            --text-sub: #8b949e;
            --border: #262c36;
            --danger: #f85149;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Top Header */
        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; z-index: 20; user-select: none; }
        .logo { font-size: 1.1rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; letter-spacing: 0.5px; }
        .auth-bar { display: flex; gap: 8px; align-items: center; }
        input[type="password"], input[type="text"] { background: #07080a; border: 1px solid var(--border); color: #fff; padding: 7px 11px; border-radius: 5px; font-size: 0.85rem; outline: none; }
        input[type="password"]:focus, input[type="text"]:focus { border-color: var(--accent); }
        button { background: var(--accent); color: #000; border: none; font-weight: 600; padding: 7px 15px; border-radius: 5px; cursor: pointer; transition: background 0.15s; font-size: 0.82rem; user-select: none; }
        button:hover { background: var(--accent-hover); }

        /* Workspace Grid */
        .workspace { display: flex; flex: 1; height: calc(100vh - 53px); overflow: hidden; }

        /* Sidebar & Search */
        .sidebar { width: 340px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-search { padding: 10px; border-bottom: 1px solid var(--border); }
        .sidebar-search input { width: 100%; }
        .sidebar-header { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.78rem; font-weight: 600; color: var(--text-sub); display: flex; justify-content: space-between; user-select: none; }
        
        .file-list { flex: 1; overflow-y: auto; list-style: none; position: relative; }
        
        /* NEW FOLDER TREE CSS */
        .folder-header { background: #0b0e14; color: var(--accent); padding: 8px 14px; font-size: 0.75rem; font-weight: 700; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 5; text-transform: uppercase; letter-spacing: 0.5px; }
        .folder-header span { color: var(--text-sub); font-weight: normal; }
        
        .file-item { padding: 11px 14px 11px 24px; border-bottom: 1px solid #181d26; font-size: 0.85rem; cursor: pointer; display: flex; flex-direction: column; gap: 3px; position: relative; }
        .file-item::before { content: "↳"; position: absolute; left: 10px; top: 11px; color: #444; font-size: 0.9rem; }
        .file-item:hover { background: var(--bg-hover); }
        .file-item.active { background: #1e2633; border-left: 3px solid var(--accent); padding-left: 21px; }
        .file-item .title { font-weight: 500; word-break: break-word; color: #fff; line-height: 1.3; }
        .file-item .meta { font-size: 0.72rem; color: var(--text-sub); }

        /* Stage */
        .stage { flex: 1; display: flex; flex-direction: column; position: relative; background: #000; overflow: hidden; }
        .video-wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; background: #000; cursor: default; }
        .video-wrapper.hide-cursor { cursor: none; }
        video { width: 100%; height: 100%; max-height: 100vh; outline: none; object-fit: contain; }

        /* VLC On-Screen Display (OSD) */
        .osd { position: absolute; top: 30px; right: 30px; background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; padding: 10px 18px; border-radius: 6px; font-size: 1rem; font-weight: 600; pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 30; }
        .osd.visible { opacity: 1; }

        /* VLC Player Deck */
        .player-deck { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.6) 70%, transparent); padding: 24px 20px 12px; display: flex; flex-direction: column; gap: 8px; opacity: 1; transition: opacity 0.3s ease; z-index: 10; user-select: none; }
        .player-deck.fade-out { opacity: 0; pointer-events: none; }

        /* Scrubbing Bar */
        .timeline-container { position: relative; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; cursor: pointer; transition: height 0.15s; }
        .timeline-container:hover { height: 9px; }
        .timeline-buffer { position: absolute; height: 100%; background: rgba(255, 255, 255, 0.35); border-radius: 3px; width: 0%; transition: width 0.2s; }
        .timeline-progress { position: absolute; height: 100%; background: var(--accent); border-radius: 3px; width: 0%; pointer-events: none; }

        /* Controls Deck */
        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 5px; }
        .ctrl-btn { background: none; border: none; color: #fff; font-size: 1.05rem; padding: 6px 9px; border-radius: 4px; cursor: pointer; transition: 0.15s; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.12); color: var(--accent); }
        .time-label { font-size: 0.82rem; font-family: monospace; cursor: pointer; margin-left: 8px; color: #d0d7de; }

        /* Volume & Boost */
        .volume-box { display: flex; align-items: center; gap: 6px; margin-left: 6px; }
        .vol-slider { -webkit-appearance: none; width: 75px; height: 4px; background: #444; border-radius: 2px; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; }
        .boost-badge { font-size: 0.72rem; padding: 2px 5px; background: #1c222d; color: var(--accent); border-radius: 3px; font-weight: 700; min-width: 40px; text-align: center; }
        .boost-badge.danger { color: var(--danger); }

        .deck-select { background: #161b22; border: 1px solid var(--border); color: #fff; padding: 4px 6px; font-size: 0.8rem; border-radius: 4px; outline: none; cursor: pointer; }

        /* Log Console */
        .logs-header { background: #0c0e12; border-top: 1px solid var(--border); padding: 6px 14px; font-size: 0.74rem; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .mini-btn { background: #1f2530; color: var(--text-main); border: 1px solid var(--border); font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; }
        .mini-btn:hover { background: #2d3545; color: #fff; }
        .logs-drawer { height: 120px; background: #050608; padding: 8px 12px; font-family: monospace; font-size: 0.76rem; overflow-y: auto; color: var(--text-sub); user-select: text; -webkit-user-select: text; cursor: text; }
        .log-entry { margin-bottom: 2px; }
        .log-entry.err { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ StreamVault HLS Pro</div>
        <div class="auth-bar">
            <!-- STRICTLY IN RAM: Destroyed on tab close -->
            <input type="password" id="vaultPassword" placeholder="AES-256 Vault Password" style="width: 230px;" autocomplete="off">
            <button id="authBtn">Unlock & Connect</button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="sidebar-search">
                <input type="text" id="searchInput" placeholder="Filter lectures or folders..." autocomplete="off">
            </div>
            <div class="sidebar-header">
                <span>LECTURE VAULTS</span>
                <span id="vaultCount">0 items</span>
            </div>
            <ul class="file-list" id="fileList">
                <li style="padding: 20px; text-align: center; color: var(--text-sub); font-size: 0.85rem;">
                    Enter vault password and connect to begin.
                </li>
            </ul>
        </aside>

        <main class="stage">
            <div class="video-wrapper" id="videoWrapper">
                <video id="vlcPlayer" playsinline></video>
                <div class="osd" id="osdDisplay"></div>

                <div class="player-deck" id="playerDeck">
                    <!-- Interactive Scrubber -->
                    <div class="timeline-container" id="timelineBar">
                        <div class="timeline-buffer" id="bufferBar"></div>
                        <div class="timeline-progress" id="progressBar"></div>
                    </div>

                    <div class="controls-row">
                        <!-- Playback Controls -->
                        <div class="control-group">
                            <button class="ctrl-btn" id="playBtn" title="Play/Pause (Space)">▶</button>
                            <button class="ctrl-btn" id="stepBackBtn" title="Previous Frame (Shift+Left)">⏮</button>
                            <button class="ctrl-btn" id="seekBack5" title="Back 5s (Left Arrow)">↺ 5s</button>
                            <button class="ctrl-btn" id="seekFwd5" title="Forward 5s (Right Arrow)">5s ↻</button>
                            <button class="ctrl-btn" id="stepFwdBtn" title="Next Frame (Shift+Right)">⏭</button>
                            <span class="time-label" id="timeDisplay" title="Click to toggle Remaining Time">00:00:00 / 00:00:00</span>
                        </div>

                        <!-- Audio, Speed, View Controls -->
                        <div class="control-group">
                            <div class="volume-box">
                                <button class="ctrl-btn" id="muteBtn" title="Mute (M)">🔊</button>
                                <input type="range" class="vol-slider" id="volSlider" min="0" max="2" step="0.05" value="1">
                                <span class="boost-badge" id="volVal">100%</span>
                            </div>

                            <button class="ctrl-btn" id="aspectBtn" title="Aspect Ratio (A)" style="font-size:0.8rem; font-weight:700;">FIT</button>

                            <select class="deck-select" id="speedSelect" title="Playback Speed ([ / ])">
                                <option value="0.5">0.50x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1" selected>1.00x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.50x</option>
                                <option value="1.75">1.75x</option>
                                <option value="2">2.00x</option>
                                <option value="2.5">2.50x</option>
                                <option value="3">3.00x</option>
                            </select>

                            <button class="ctrl-btn" id="pipBtn" title="Picture-in-Picture (P)">🗔</button>
                            <button class="ctrl-btn" id="fullBtn" title="Fullscreen (F)">⛶</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="logs-header">
                <span>CONSOLE LOGS</span>
                <div style="display: flex; gap: 6px;">
                    <button class="mini-btn" id="copyLogsBtn">📋 Copy Logs</button>
                    <button class="mini-btn" id="clearLogsBtn">✕ Clear</button>
                </div>
            </div>
            <div class="logs-drawer" id="logsOutput"></div>
        </main>
    </div>

    <!-- Embedded Engine -->
    <script>
        const GOOGLE_CLIENT_ID = '185170823583-t1g2t509cd1ogbhj9i9ctjb1rk9mpu8q.apps.googleusercontent.com';
        const TARGET_DRIVE_FOLDER = '1BZzgwFUc-ISA6QyW--_31zP10IiMS_d0';

        const video = document.getElementById('vlcPlayer');
        const videoWrapper = document.getElementById('videoWrapper');
        const playerDeck = document.getElementById('playerDeck');
        const osd = document.getElementById('osdDisplay');
        const logsOutput = document.getElementById('logsOutput');
        const searchInput = document.getElementById('searchInput');

        let accessToken = null;
        let hlsInstance = null;
        let cachedFiles = [];
        let osdTimeout = null;
        let idleTimer = null;

        // Logging Pipe
        function appendLog(msg, isErr = false) {
            const row = document.createElement('div');
            row.className = `log-entry ${isErr ? 'err' : ''}`;
            row.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logsOutput.appendChild(row);
            logsOutput.scrollTop = logsOutput.scrollHeight;
        }

        const logChannel = new BroadcastChannel('streamvault_logs');
        logChannel.onmessage = (e) => appendLog(e.data.msg, e.data.isError);

        // Copy & Clear Logs
        document.getElementById('copyLogsBtn').onclick = () => {
            const logsText = Array.from(logsOutput.querySelectorAll('.log-entry')).map(el => el.textContent).join('\n');
            if (!logsText) return showOSD('No logs to copy');
            navigator.clipboard.writeText(logsText).then(() => showOSD('Logs Copied!')).catch(() => {
                const ta = document.createElement('textarea'); ta.value = logsText; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showOSD('Logs Copied!');
            });
        };
        document.getElementById('clearLogsBtn').onclick = () => logsOutput.innerHTML = '';

        // Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => appendLog('Service Worker Engine online.'))
                .catch(err => appendLog(`SW Registration failed: ${err.message}`, true));
        }

        function showOSD(text) {
            osd.textContent = text;
            osd.classList.add('visible');
            clearTimeout(osdTimeout);
            osdTimeout = setTimeout(() => osd.classList.remove('visible'), 1200);
        }

        function resetIdleTimer() {
            playerDeck.classList.remove('fade-out');
            videoWrapper.classList.remove('hide-cursor');
            clearTimeout(idleTimer);
            if (!video.paused) {
                idleTimer = setTimeout(() => {
                    playerDeck.classList.add('fade-out');
                    videoWrapper.classList.add('hide-cursor');
                }, 2500);
            }
        }
        videoWrapper.addEventListener('mousemove', resetIdleTimer);
        video.addEventListener('play', resetIdleTimer);
        video.addEventListener('pause', () => {
            playerDeck.classList.remove('fade-out');
            videoWrapper.classList.remove('hide-cursor');
            clearTimeout(idleTimer);
        });

        // Google Auth
        let tokenClient;
        document.getElementById('authBtn').addEventListener('click', () => {
            const password = document.getElementById('vaultPassword').value;
            if (!password) return alert('Enter your AES-256 Vault Password first.');

            try {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'https://www.googleapis.com/auth/drive.readonly',
                    callback: async (resp) => {
                        if (resp.error) return appendLog(`Auth Failed: ${resp.error}`, true);
                        accessToken = resp.access_token;
                        appendLog('Google Auth Token synchronized (RAM only).');

                        if (navigator.serviceWorker.controller) {
                            navigator.serviceWorker.controller.postMessage({ type: 'SYNC_TOKEN', token: accessToken });
                        }
                        await scanDriveFolder();
                    }
                });
                tokenClient.requestAccessToken({ prompt: 'consent' });
            } catch (err) {
                appendLog(`OAuth Error: ${err.message}`, true);
            }
        });

        // Recursive Subfolder Scanner
        async function scanDriveFolder() {
            appendLog('Starting recursive scan of destination folder tree...');
            const fileListEl = document.getElementById('fileList');
            fileListEl.innerHTML = '<li style="padding: 20px; text-align: center; color: var(--text-sub);">Crawling directory tree...</li>';

            try {
                const folderPaths = new Map();
                folderPaths.set(TARGET_DRIVE_FOLDER, "Root");
                const folderQueue = [TARGET_DRIVE_FOLDER];

                while (folderQueue.length > 0) {
                    const currentId = folderQueue.shift();
                    const currentPath = folderPaths.get(currentId) === "Root" ? "" : folderPaths.get(currentId);

                    let pageToken = null;
                    do {
                        const q = `'${currentId}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`;
                        const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=nextPageToken,files(id,name)&pageSize=1000${pageToken ? `&pageToken=${pageToken}` : ''}`, {
                            headers: { 'Authorization': `Bearer ${accessToken}` }
                        });
                        const data = await res.json();
                        if (data.error) throw new Error(data.error.message);

                        for (const folder of (data.files || [])) {
                            const subPath = currentPath ? `${currentPath} / ${folder.name}` : folder.name;
                            folderPaths.set(folder.id, subPath);
                            folderQueue.push(folder.id);
                        }
                        pageToken = data.nextPageToken;
                    } while (pageToken);
                }

                appendLog(`Indexed folders. Fetching all _HLS_Z.zip archives...`);

                let allFiles = [];
                let filePageToken = null;
                do {
                    const query = `mimeType != 'application/vnd.google-apps.folder' and trashed = false and name contains '_HLS_Z.zip'`;
                    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(query)}&fields=nextPageToken,files(id,name,size,parents)&pageSize=500${filePageToken ? `&pageToken=${filePageToken}` : ''}`, {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const data = await res.json();
                    if (data.error) throw new Error(data.error.message);
                    allFiles.push(...(data.files || []));
                    filePageToken = data.nextPageToken;
                } while (filePageToken);

                const targetFiles = allFiles.filter(f => f.parents && f.parents.some(p => folderPaths.has(p)));
                
                targetFiles.forEach(f => {
                    const parentId = f.parents.find(p => folderPaths.has(p));
                    f.folderPath = folderPaths.get(parentId) || "Root";
                });

                cachedFiles = targetFiles;
                renderFileList(cachedFiles);
                appendLog(`Scan complete. Found ${targetFiles.length} archives.`);

            } catch (err) {
                appendLog(`Drive Scan Failed: ${err.message}`, true);
            }
        }

        // NEW: Grouped Folder Render
        function renderFileList(files) {
            const fileListEl = document.getElementById('fileList');
            fileListEl.innerHTML = '';
            document.getElementById('vaultCount').textContent = `${files.length} items`;

            if (files.length === 0) {
                fileListEl.innerHTML = `<li style="padding: 20px; color: var(--text-sub); font-size: 0.82rem;">No matching vaults found.</li>`;
                return;
            }

            // Group by Folder Path
            const groups = {};
            files.forEach(f => {
                const path = f.folderPath || "Root";
                if (!groups[path]) groups[path] = [];
                groups[path].push(f);
            });

            // Render Groups
            Object.keys(groups).sort().forEach(folderName => {
                // Folder Header
                const header = document.createElement('div');
                header.className = 'folder-header';
                header.innerHTML = `📁 ${folderName} <span>(${groups[folderName].length})</span>`;
                fileListEl.appendChild(header);

                // Sort files inside folder alphabetically
                groups[folderName].sort((a, b) => a.name.localeCompare(b.name)).forEach(file => {
                    const cleanTitle = file.name.replace('_HLS_Z.zip', '');
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerHTML = `
                        <div class="title">${cleanTitle}</div>
                        <div class="meta">${(file.size / 1048576).toFixed(1)} MB • AES-256 Vault</div>
                    `;
                    li.onclick = () => loadHlsStream(file.id, cleanTitle, li);
                    fileListEl.appendChild(li);
                });
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = cachedFiles.filter(f => 
                f.name.toLowerCase().includes(term) || 
                (f.folderPath && f.folderPath.toLowerCase().includes(term))
            );
            renderFileList(filtered);
        });

        // HLS Loader with SMOOTH ENGINE FIX
        function loadHlsStream(fileId, title, listItem) {
            const password = document.getElementById('vaultPassword').value;
            if (!password) return alert('Enter your AES-256 Vault Password at the top.');

            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            listItem.classList.add('active');

            navigator.serviceWorker.controller.postMessage({ type: 'UNLOCK', fileId, password });

            if (hlsInstance) hlsInstance.destroy();
            appendLog(`Mounting HLS stream: ${title}...`);
            showOSD(`Loading: ${title}`);
            
            const playlistUrl = `/stream-vault/${fileId}/master.m3u8`;

            if (Hls.isSupported()) {
                hlsInstance = new Hls({
                    // SMOOTH PLAYBACK FIX:
                    maxBufferLength: 60,       // Buffer up to 60 seconds ahead
                    maxMaxBufferLength: 120,   // Hard RAM ceiling
                    maxBufferSize: 50 * 1024 * 1024, // Allow up to 50MB of RAM for butter-smooth skipping
                    enableWorker: true         // CRITICAL: Unlocks main thread, fixes video chop
                });

                hlsInstance.loadSource(playlistUrl);
                hlsInstance.attachMedia(video);

                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    appendLog('Vault unlocked. Stream ready.');
                    initAudioBooster();
                    video.play().catch(() => {});
                });

                hlsInstance.on(Hls.Events.ERROR, (e, data) => {
                    if (data.fatal) appendLog(`HLS Error: ${data.details}`, true);
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = playlistUrl;
                video.play();
            }
        }

        // Web Audio API Booster
        let audioCtx, gainNode;
        function initAudioBooster() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            audioCtx = new AudioContext();
            const source = audioCtx.createMediaElementSource(video);
            gainNode = audioCtx.createGain();
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);
        }

        const volSlider = document.getElementById('volSlider');
        const volVal = document.getElementById('volVal');
        const muteBtn = document.getElementById('muteBtn');

        function setVolume(val) {
            initAudioBooster();
            val = Math.max(0, Math.min(2.0, val));
            volSlider.value = val;
            if (gainNode) gainNode.gain.value = val;
            const pct = Math.round(val * 100);
            volVal.textContent = `${pct}%`;
            volVal.classList.toggle('danger', pct > 150);
            muteBtn.textContent = val === 0 ? '🔇' : (val > 1 ? '🔊' : '🔉');
            showOSD(`Volume: ${pct}%`);
        }

        volSlider.addEventListener('input', (e) => setVolume(parseFloat(e.target.value)));
        muteBtn.onclick = () => {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? '🔇' : (parseFloat(volSlider.value) > 1 ? '🔊' : '🔉');
            showOSD(video.muted ? 'Muted' : `Volume: ${Math.round(volSlider.value * 100)}%`);
        };

        const aspectBtn = document.getElementById('aspectBtn');
        const aspectModes = ['contain', 'cover', 'fill'];
        const aspectLabels = ['FIT', 'ZOOM', 'STRETCH'];
        let currentAspectIdx = 0;
        function cycleAspectRatio() {
            currentAspectIdx = (currentAspectIdx + 1) % aspectModes.length;
            video.style.objectFit = aspectModes[currentAspectIdx];
            aspectBtn.textContent = aspectLabels[currentAspectIdx];
            showOSD(`Aspect: ${aspectLabels[currentAspectIdx]}`);
        }
        aspectBtn.onclick = cycleAspectRatio;

        const playBtn = document.getElementById('playBtn');
        function togglePlay() {
            initAudioBooster();
            if (video.paused) { video.play(); showOSD('Play'); } 
            else { video.pause(); showOSD('Pause'); }
        }
        playBtn.onclick = togglePlay;
        video.onclick = togglePlay;
        video.onplay = () => playBtn.textContent = '⏸';
        video.onpause = () => playBtn.textContent = '▶';

        let showRemaining = false;
        let isScrubbing = false;
        const timeDisplay = document.getElementById('timeDisplay');
        const timelineBar = document.getElementById('timelineBar');
        const progressBar = document.getElementById('progressBar');
        const bufferBar = document.getElementById('bufferBar');

        timeDisplay.onclick = () => showRemaining = !showRemaining;
        const fmt = (s) => isNaN(s) ? '00:00:00' : new Date(s * 1000).toISOString().substr(11, 8);

        video.addEventListener('timeupdate', () => {
            if (isScrubbing) return;
            const cur = video.currentTime, dur = video.duration || 0;
            progressBar.style.width = `${(cur / dur) * 100}%`;
            if (video.buffered.length > 0) bufferBar.style.width = `${(video.buffered.end(video.buffered.length - 1) / dur) * 100}%`;
            timeDisplay.textContent = showRemaining ? `-${fmt(dur - cur)} / ${fmt(dur)}` : `${fmt(cur)} / ${fmt(dur)}`;
        });

        function seekFromEvent(e) {
            const rect = timelineBar.getBoundingClientRect();
            const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            progressBar.style.width = `${pos * 100}%`;
            video.currentTime = pos * video.duration;
        }

        timelineBar.addEventListener('mousedown', (e) => { isScrubbing = true; seekFromEvent(e); });
        window.addEventListener('mousemove', (e) => { if (isScrubbing) seekFromEvent(e); });
        window.addEventListener('mouseup', () => isScrubbing = false);

        function seekRelative(secs) {
            video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + secs));
            showOSD(`${secs > 0 ? '+' : ''}${secs}s`);
        }
        document.getElementById('seekBack5').onclick = () => seekRelative(-5);
        document.getElementById('seekFwd5').onclick = () => seekRelative(5);
        document.getElementById('stepBackBtn').onclick = () => { video.pause(); video.currentTime -= 0.04; showOSD('-1 Frame'); };
        document.getElementById('stepFwdBtn').onclick = () => { video.pause(); video.currentTime += 0.04; showOSD('+1 Frame'); };

        const speedSelect = document.getElementById('speedSelect');
        function setSpeed(rate) { video.playbackRate = rate; speedSelect.value = rate.toString(); showOSD(`Speed: ${rate.toFixed(2)}x`); }
        speedSelect.onchange = (e) => setSpeed(parseFloat(e.target.value));

        document.getElementById('pipBtn').onclick = () => document.pictureInPictureElement ? document.exitPictureInPicture() : video.requestPictureInPicture();
        document.getElementById('fullBtn').onclick = () => document.fullscreenElement ? document.exitFullscreen() : videoWrapper.requestFullscreen();

        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'SELECT'].includes(e.target.tagName)) return;
            switch(e.code) {
                case 'Space': e.preventDefault(); togglePlay(); break;
                case 'ArrowLeft': e.preventDefault(); seekRelative(e.shiftKey ? -1 : -5); break;
                case 'ArrowRight': e.preventDefault(); seekRelative(e.shiftKey ? 1 : 5); break;
                case 'ArrowUp': e.preventDefault(); setVolume(parseFloat(volSlider.value) + 0.05); break;
                case 'ArrowDown': e.preventDefault(); setVolume(parseFloat(volSlider.value) - 0.05); break;
                case 'KeyF': document.getElementById('fullBtn').click(); break;
                case 'KeyM': muteBtn.click(); break;
                case 'KeyP': document.getElementById('pipBtn').click(); break;
                case 'KeyA': cycleAspectRatio(); break;
                case 'BracketRight': setSpeed(Math.min(3.0, video.playbackRate + 0.25)); break;
                case 'BracketLeft': setSpeed(Math.max(0.25, video.playbackRate - 0.25)); break;
            }
        });
    </script>
</body>
</html>

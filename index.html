<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault HLS Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        :root {
            --bg-main: #0d0f12;
            --bg-card: #16191f;
            --accent: #ff8c00;
            --accent-hover: #ffa033;
            --text-main: #f0f3f6;
            --text-sub: #8b949e;
            --border: #30363d;
            --danger: #f85149;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.15rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .auth-bar { display: flex; gap: 10px; align-items: center; }
        input[type="password"] { background: #0b0c0e; border: 1px solid var(--border); color: #fff; padding: 7px 10px; border-radius: 6px; font-size: 0.85rem; outline: none; }
        input[type="password"]:focus { border-color: var(--accent); }
        button { background: var(--accent); color: #000; border: none; font-weight: 600; padding: 7px 16px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        button:hover { background: var(--accent-hover); }

        .workspace { display: flex; flex: 1; height: calc(100vh - 61px); overflow: hidden; }
        .sidebar { width: 320px; background: var(--bg-card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 0.85rem; font-weight: 600; color: var(--text-sub); display: flex; justify-content: space-between; }
        .file-list { flex: 1; overflow-y: auto; list-style: none; }
        .file-item { padding: 12px 16px; border-bottom: 1px solid #1f242c; font-size: 0.88rem; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
        .file-item:hover { background: #1c2128; }
        .file-item.active { background: #262c36; border-left: 3px solid var(--accent); }
        .file-item .title { font-weight: 500; word-break: break-word; }
        .file-item .meta { font-size: 0.75rem; color: var(--text-sub); }

        .stage { flex: 1; display: flex; flex-direction: column; position: relative; background: #000; }
        .video-wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { width: 100%; height: 100%; max-height: 100vh; outline: none; }

        .player-deck { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(10,10,12,0.95), transparent); padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.3s; z-index: 10; }
        .video-wrapper:hover .player-deck, .player-deck.locked { opacity: 1; }

        .timeline-container { position: relative; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; cursor: pointer; }
        .timeline-buffer { position: absolute; height: 100%; background: rgba(255, 255, 255, 0.4); border-radius: 3px; width: 0%; }
        .timeline-progress { position: absolute; height: 100%; background: var(--accent); border-radius: 3px; width: 0%; }

        .controls-row { display: flex; justify-content: space-between; align-items: center; }
        .control-group { display: flex; align-items: center; gap: 6px; }
        .ctrl-btn { background: none; border: none; color: #fff; font-size: 1.1rem; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
        .ctrl-btn:hover { background: rgba(255, 255, 255, 0.15); color: var(--accent); }
        .time-label { font-size: 0.85rem; font-family: monospace; cursor: pointer; margin-left: 10px; }
        
        .volume-box { display: flex; align-items: center; gap: 8px; margin-left: 10px; }
        .vol-slider { -webkit-appearance: none; width: 80px; height: 4px; background: #555; border-radius: 2px; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; }
        .boost-badge { font-size: 0.75rem; padding: 2px 5px; background: #262c36; color: var(--accent); border-radius: 3px; font-weight: bold; }
        .deck-select { background: #1c2128; border: 1px solid var(--border); color: #fff; padding: 4px; font-size: 0.85rem; border-radius: 4px; outline: none; }

        .logs-drawer { height: 130px; background: #08090b; border-top: 1px solid var(--border); padding: 10px 15px; font-family: monospace; font-size: 0.8rem; overflow-y: auto; color: var(--text-sub); }
        .log-entry.err { color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ StreamVault</div>
        <div class="auth-bar">
            <!-- STRICTLY IN RAM: Destroyed on tab close -->
            <input type="password" id="vaultPassword" placeholder="AES-256 Vault Password" style="width: 200px;" autocomplete="off">
            <button id="authBtn">Unlock & Connect</button>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>LECTURE VAULTS</span>
                <span id="vaultCount">0 items</span>
            </div>
            <ul class="file-list" id="fileList">
                <li style="padding: 20px; text-align: center; color: var(--text-sub); font-size: 0.85rem;">
                    Sign in to load your encrypted archives.
                </li>
            </ul>
        </aside>

        <main class="stage">
            <div class="video-wrapper" id="videoWrapper">
                <video id="vlcPlayer" playsinline></video>

                <div class="player-deck" id="playerDeck">
                    <div class="timeline-container" id="timelineBar">
                        <div class="timeline-buffer" id="bufferBar"></div>
                        <div class="timeline-progress" id="progressBar"></div>
                    </div>

                    <div class="controls-row">
                        <div class="control-group">
                            <button class="ctrl-btn" id="playBtn" title="Play/Pause (Space)">▶</button>
                            <button class="ctrl-btn" id="stepBackBtn" title="Previous Frame (Shift+Left)">⏮</button>
                            <button class="ctrl-btn" id="seekBack5" title="Back 5s (Left Arrow)">↺ 5s</button>
                            <button class="ctrl-btn" id="seekFwd5" title="Forward 5s (Right Arrow)">5s ↻</button>
                            <button class="ctrl-btn" id="stepFwdBtn" title="Next Frame (Shift+Right)">⏭</button>
                            <span class="time-label" id="timeDisplay" title="Click to toggle Remaining Time">00:00:00 / 00:00:00</span>
                        </div>

                        <div class="control-group">
                            <div class="volume-box">
                                <button class="ctrl-btn" id="muteBtn" title="Mute (M)">🔊</button>
                                <input type="range" class="vol-slider" id="volSlider" min="0" max="2" step="0.05" value="1">
                                <span class="boost-badge" id="volVal">100%</span>
                            </div>

                            <select class="deck-select" id="speedSelect" title="Playback Speed ([ / ])">
                                <option value="0.5">0.50x</option>
                                <option value="0.75">0.75x</option>
                                <option value="1" selected>1.00x</option>
                                <option value="1.25">1.25x</option>
                                <option value="1.5">1.50x</option>
                                <option value="2">2.00x</option>
                                <option value="3">3.00x</option>
                            </select>

                            <button class="ctrl-btn" id="pipBtn" title="Picture-in-Picture (P)">🗔</button>
                            <button class="ctrl-btn" id="fullBtn" title="Fullscreen (F)">⛶</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="logs-drawer" id="logsOutput"></div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>

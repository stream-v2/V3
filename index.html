<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault | Secure Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.29/dist/zip.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer onload="initApp()"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-server text-blue-500 text-xl"></i>
                <h1 class="text-xl font-bold text-white">StreamVault <span class="text-slate-500 font-normal text-sm ml-2">Explorer</span></h1>
            </div>
            <button id="authBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold transition-all shadow-lg flex items-center gap-2">
                <i class="fa-brands fa-google"></i> Connect
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-6 py-8 w-full">
        
        <!-- Video Player -->
        <div id="playerContainer" class="hidden mb-8 animate-fade-in">
            <div class="flex items-center justify-between mb-3">
                <h2 id="nowPlayingLabel" class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-play text-blue-500"></i> Now Playing
                </h2>
                <button onclick="document.getElementById('videoPlayer').requestFullscreen()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-expand text-lg"></i>
                </button>
            </div>
            <div class="bg-black rounded-xl overflow-hidden shadow-2xl aspect-video border border-slate-700">
                <video id="videoPlayer" class="w-full h-full object-contain" controls></video>
            </div>
        </div>

        <!-- Breadcrumb Navigation -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-3 mb-6 flex items-center gap-2 overflow-x-auto text-sm font-medium text-slate-400" id="breadcrumbs">
            <!-- Breadcrumbs injected via JS -->
            <span><i class="fa-solid fa-house"></i> Waiting for connection...</span>
        </div>
        
        <div id="statusText" class="text-sm text-slate-500 mb-4 hidden"></div>

        <!-- File & Folder Grid -->
        <div id="fileGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </main>

    <!-- Password Modal -->
    <div id="passwordModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950/80 backdrop-blur-sm">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-2xl w-full max-w-sm">
            <div class="text-center mb-6">
                <i class="fa-solid fa-file-shield text-3xl text-blue-500 mb-3"></i>
                <h3 class="text-xl font-bold text-white">Decrypt Video</h3>
                <p id="targetFileLabel" class="text-xs text-slate-400 mt-1 truncate px-2"></p>
            </div>
            
            <form id="unlockForm" class="flex flex-col gap-4">
                <input type="password" id="archivePassword" placeholder="Enter AES-256 Password" required
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white focus:border-blue-500 outline-none">
                <div class="flex gap-2">
                    <button type="button" id="cancelUnlock" class="flex-1 py-3 bg-slate-700 rounded-lg text-sm font-bold">Cancel</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 rounded-lg text-sm font-bold text-white">Unlock</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

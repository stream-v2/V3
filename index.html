<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zip.js/zip.js@2.7.29/dist/zip.min.js"></script>
    <!-- Google Identity Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-900 text-white p-8 font-sans max-w-5xl mx-auto">

    <div class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
        <h1 class="text-2xl font-bold">StreamVault Engine Test</h1>
        <button id="authBtn" class="bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded font-bold transition-colors">
            Connect Google Drive
        </button>
    </div>

    <!-- Status & Errors -->
    <div id="statusBox" class="mb-6 p-4 rounded bg-slate-800 text-slate-300 font-mono text-sm">
        System booting... Please wait.
    </div>

    <!-- Video Player (Hidden initially) -->
    <div id="playerWrapper" class="hidden mb-8">
        <h2 id="videoTitle" class="text-lg font-bold mb-2 text-blue-400"></h2>
        <video id="videoPlayer" class="w-full bg-black rounded-lg aspect-video" controls></video>
    </div>

    <!-- File List -->
    <div id="fileList" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>

    <script src="app.js"></script>
</body>
</html>
